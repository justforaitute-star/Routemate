<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="rm-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#304C64" />
      <stop offset="55%" stop-color="#26788E" />
      <stop offset="100%" stop-color="#1E5F72" />
    </linearGradient>
    <linearGradient id="rm-glass" x1="96" y1="88" x2="416" y2="424" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34" />
      <stop offset="100%" stop-color="#A4CCD4" stop-opacity="0.14" />
    </linearGradient>
    <linearGradient id="rm-amber" x1="312" y1="108" x2="416" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#E2480C" />
    </linearGradient>
  </defs>

  <!-- Full-bleed rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#rm-bg)" />

  <!-- Subtle radial highlight -->
  <circle cx="152" cy="128" r="180" fill="#A4CCD4" fill-opacity="0.18" />

  <!-- Liquid Glass center tile -->
  <rect x="84" y="84" width="344" height="344" rx="84" fill="url(#rm-glass)" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="5" />

  <!-- Bus silhouette (clean Lucide-inspired geometry) -->
  <g stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Bus body -->
    <path d="M168 176C168 158.327 182.327 144 200 144H312C329.673 144 344 158.327 344 176V304C344 317.255 333.255 328 320 328H192C178.745 328 168 317.255 168 304V176Z" fill="#FFFFFF" fill-opacity="0.12" />
    <!-- Roof bar -->
    <line x1="212" y1="168" x2="300" y2="168" stroke="#A4CCD4" stroke-width="12" />
    <!-- Windshield divider -->
    <line x1="168" y1="252" x2="344" y2="252" />
    <line x1="256" y1="194" x2="256" y2="252" stroke-width="14" />
    <!-- Headlights -->
    <circle cx="204" cy="290" r="10" fill="#FDBA74" stroke="none" />
    <circle cx="308" cy="290" r="10" fill="#FDBA74" stroke="none" />
    <!-- Wheels -->
    <path d="M196 328V352C196 358.627 201.373 364 208 364H220C226.627 364 232 358.627 232 352V328" fill="#FFFFFF" stroke="none" />
    <path d="M280 328V352C280 358.627 285.373 364 292 364H304C310.627 364 316 358.627 316 352V328" fill="#FFFFFF" stroke="none" />
  </g>

  <!-- Live GPS Beacon Pin Badge -->
  <circle cx="358" cy="154" r="34" fill="url(#rm-amber)" stroke="#FFFFFF" stroke-width="6" />
  <circle cx="358" cy="154" r="11" fill="#FFFFFF" />
</svg>
